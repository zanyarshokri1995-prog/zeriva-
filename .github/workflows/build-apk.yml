name: Build ZERIVA APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Release ZERIVA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print

      - name: Prepare APK
        run: |
          mkdir -p release

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not found."
            exit 1
          fi

          echo "Found APK: $APK"
          cp "$APK" release/ZERIVA-APK.apk

          ls -lh release/ZERIVA-APK.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="zeriva-v1.${{ github.run_number }}"

          gh release create "$TAG" \
            release/ZERIVA-APK.apk \
            --title "ZERIVA APK v1.${{ github.run_number }}" \
            --notes "ZERIVA Android APK"
